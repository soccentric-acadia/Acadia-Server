version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: acadia-postgres
    environment:
      POSTGRES_DB: acadia
      POSTGRES_USER: acadia
      POSTGRES_PASSWORD: acadia_dev
    ports:
      - "5432:5432"
    volumes:
      - acadia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acadia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  acadia_pgdata:
