version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: acadia
      POSTGRES_USER: acadia
      POSTGRES_PASSWORD: dev_password
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acadia"]
      interval: 5s
      timeout: 5s
      retries: 10

  acadia-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: ../.env
    environment:
      ACADIA_DB_HOST: postgres
      ACADIA_DB_NAME: acadia
      ACADIA_DB_USER: acadia
      ACADIA_DB_PASSWORD: dev_password
    ports:
      - "9090:9090"   # gRPC
      - "8080:8080"   # HTTP/REST
    volumes:
      - ota_storage:/app/ota
      - ./registry.yaml:/app/registry.yaml:ro

volumes:
  pg_data:
  ota_storage:
